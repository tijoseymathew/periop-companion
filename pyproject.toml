[project]
name = "periop-companion"
version = "0.1.0"
description = "Agentic peri-operative documentation assistant with claim-level provenance"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/periop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
